<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="256" viewBox="0 0 1024 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141d18"/>
      <stop offset="1" stop-color="#0b110e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1DB86A" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#1DB86A" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Panel -->
  <rect x="0" y="0" width="1024" height="256" rx="22" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="256" rx="22" fill="url(#glow)"/>
  <rect x="20" y="20" width="984" height="216" rx="12" fill="none" stroke="#1DB86A" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- Circuit traces -->
  <g fill="none" stroke="#1DB86A" stroke-opacity="0.25" stroke-width="1.5">
    <path d="M46 100 H250 L270 118 H440"/>
    <path d="M700 96 H820 L840 110 H1000"/>
    <path d="M760 166 H880 L900 184 H1000"/>
    <path d="M40 170 H240 L262 150 H290"/>
  </g>
  <g fill="#1DB86A" fill-opacity="0.6">
    <circle cx="440" cy="118" r="3"/>
    <circle cx="700" cy="96" r="3"/>
    <circle cx="880" cy="184" r="3"/>
  </g>

  <!-- Line 1: command -->
  <text x="46" y="84" font-family="'JetBrains Mono', 'Courier New', monospace" font-weight="700" font-size="47">
    <tspan fill="#8FD4A8">luca@lucacraft89</tspan><tspan fill="#C9D6CE">:~$ echo $SHELL</tspan>
  </text>

  <!-- Line 2: output + name -->
  <text x="46" y="152" font-family="'JetBrains Mono', 'Courier New', monospace" font-weight="700" font-size="47" fill="#A8C5B0">/usr/bin/</text>
  <text x="301" y="152" font-family="'JetBrains Mono', 'Courier New', monospace" font-weight="700" font-size="47" fill="#B8F0C8" filter="url(#neon)">LucaCraft89</text>

  <!-- Line 3: prompt + blinking cursor -->
  <text x="46" y="218" font-family="'JetBrains Mono', 'Courier New', monospace" font-weight="700" font-size="47" fill="#8FD4A8">luca@lucacraft89:~$</text>
  <rect x="606" y="174" width="28" height="50" fill="#2FBF71">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;0.9;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
